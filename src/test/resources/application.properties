# ── Test configuration — overrides main application.properties during mvn test ──
# Uses H2 in-memory database instead of MySQL so tests run in GitHub Actions CI

# Needed while PremiumAccountService (Week 1 class, @Value("${bank.name}")) is in the project
bank.name=NeoBank Global

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Actuator — expose health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Suppress Spring Security's auto-generated password log noise in CI
logging.level.org.springframework.security=WARN
